# ✅ DEMO FILE - Shows SAFE configuration patterns
# This file uses variable substitution instead of hardcoded values

application:
  name: my-secure-app
  version: 1.0.0

api:
  # ✅ GOOD: Reference to environment variable
  API_KEY: ${API_KEY}
  base_url: https://api.example.com
  timeout: 30

database:
  # ✅ GOOD: Variable reference
  connection_string: ${DATABASE_URL}
  pool_size: 10

# Note: The API_KEY reference here is SAFE because it uses ${...} syntax
# which means the value comes from an environment variable at runtime,
# not hardcoded in this file.
